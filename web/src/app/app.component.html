<div class="h-screen bg-gradient-to-br from-gray-900 to-slate-900 flex flex-col">
  <!-- Header -->
  <header class="backdrop-blur-lg bg-slate-800/30 border-b border-slate-700/50 shrink-0">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <!-- Logo and Navigation -->
        <div class="flex items-center">
          <a routerLink="/" class="flex items-center space-x-3 hover:no-underline">
            <app-logo class="w-8 h-8" />
            <span class="text-xl font-bold bg-gradient-to-r from-blue-400 to-cyan-300 text-transparent bg-clip-text">
                  SSVC Evaluator
                </span>
          </a>
          <nav class="ml-10 flex items-center space-x-4">
            <a routerLink="/"
               routerLinkActive="!text-blue-400"
               [routerLinkActiveOptions]="{exact: true}"
               class="text-gray-300 hover:text-blue-400 px-3 py-2 rounded-md text-sm font-medium transition-colors hover:no-underline">
              Evaluate
            </a>
            <a routerLink="/tasks"
               routerLinkActive="!text-blue-400"
               class="text-gray-300 hover:text-blue-400 px-3 py-2 rounded-md text-sm font-medium transition-colors hover:no-underline">
              Tasks
            </a>
          </nav>
        </div>

        <!-- Right side buttons/menu -->
        <div class="flex items-center space-x-4">
          <a href="https://github.com/boring91/google-ssvc"
             target="_blank"
             class="text-gray-400 hover:text-gray-300 transition-colors">
            <svg class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24">
              <path fill-rule="evenodd"
                    d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"
                    clip-rule="evenodd"></path>
            </svg>
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="grow overflow-y-auto p-4">
    <router-outlet />
  </main>

  <!-- Footer -->
  <footer class="bg-slate-800/30 border-t border-slate-700/50 shrink-0">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
      <div class="flex flex-col items-center justify-center space-y-2">
        <div class="text-sm text-gray-400">
          SSVC Evaluator
        </div>
        <div class="flex items-center space-x-4 text-sm text-gray-500">
          <a
            href="{{environment.apiUrl}}/docs"
            class="hover:text-gray-300 transition-colors"
            target="_blank">
            API Documentation
          </a>
          <span>·</span>
          <a href="https://github.com/boring91/google-ssvc"
             class="hover:text-gray-300 transition-colors"
             target="_blank">
            GitHub
          </a>
        </div>
      </div>
    </div>
  </footer>
</div>
